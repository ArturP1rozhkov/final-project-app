# .github/workflows/app.yml

name: app

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: cr.yandex/${{ vars.YC_REGISTRY_ID }}/final-project-app

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: тег
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: вход в реестр
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: printf '%s' "$YC_SA_KEY_JSON" | docker login --username json_key --password-stdin cr.yandex

      - name: сборка
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.tag }} \
            --build-arg BUILD_DATE="$(date -u +%F)" \
            -t "$IMAGE:${{ steps.meta.outputs.tag }}" \
            -t "$IMAGE:latest" .

      - name: push
        run: |
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:latest"

  # API кластера не опубликован в интернет, поэтому деплой идёт
  # с self-hosted раннера на бастионе, где лежит ~/.kube/config
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: self-hosted
    steps:
      - name: деплой
        run: |
          kubectl -n app set image deploy/app app=$IMAGE:${{ needs.build.outputs.tag }}
          kubectl -n app rollout status deploy/app --timeout=180s
          kubectl -n app get pods -o wide
